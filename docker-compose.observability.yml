# Monitoring overlay — Grafana Alloy shipping metrics and logs to Grafana Cloud.
#
# Deliberately a separate file rather than another service in docker-compose.yml:
# local development has no Grafana Cloud stack and does not want a container
# scraping it, and a production host is the only place the mounts below (the
# docker socket, /proc, /sys, the host root) make sense. Nothing else in the
# stack depends on it, so it can be restarted, broken or removed without the
# application noticing.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d alloy
#
# Configuration is docker/alloy/config.alloy; secrets come from the same .env as
# the application (GRAFANA_* keys, see .env.example).
# Full context: docs/plans/GRAFANA_OBSERVABILITY_PLAN.md
services:
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: flok_alloy
    restart: unless-stopped
    # The listen address must be 0.0.0.0 and not the default loopback: the
    # config scrapes Alloy's own /metrics to pick up the counters that
    # loki.process builds out of the log stream.
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:?set GRAFANA_CLOUD_TOKEN in .env}
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:?set GRAFANA_PROM_URL in .env}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:?set GRAFANA_PROM_USER in .env}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:?set GRAFANA_LOKI_URL in .env}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:?set GRAFANA_LOKI_USER in .env}
      GRAFANA_POSTGRES_DSN: ${GRAFANA_POSTGRES_DSN:?set GRAFANA_POSTGRES_DSN in .env}
      GRAFANA_INSTANCE: ${GRAFANA_INSTANCE:-flok-prod}
      GRAFANA_ENVIRONMENT: ${APP_ENV:-production}
    volumes:
      - ./docker/alloy:/etc/alloy:ro
      # The application's JSON log files. Read from disk rather than from the
      # container's stdout — config.alloy explains why PHP-FPM makes stdout
      # useless for this.
      - ./storage/logs:/var/log/flok:ro
      # Written by `php artisan qasa:metrics:export` (config/qasa.php →
      # qasa.metrics.textfile_dir). Read-only here: the agent must never be
      # able to write into the application's storage directory.
      - ./storage/app/metrics:/var/lib/alloy/textfile:ro
      # Container discovery, container logs and cAdvisor all go through the
      # socket. Read-only, but note this is still effectively root on the host
      # — the reason the whole overlay is opt-in and never runs locally.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - alloydata:/var/lib/alloy/data
    # Host PID namespace so the host's processes and network counters are
    # visible; without it the metrics describe one container.
    pid: host
    networks:
      - laravel
    depends_on:
      - nginx
      - db

networks:
  laravel:
    driver: bridge

volumes:
  alloydata:
    driver: local
