# blackbox_exporter modules used by prometheus.exporter.blackbox in
# docker/alloy/config.alloy. One module, because there is one thing to probe:
# does Laravel's health route answer 200 from inside the compose network.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false
