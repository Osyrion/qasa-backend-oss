# Client IP, coarsened before it is ever written.
#
# The access log below is shipped to Grafana Cloud (docker/alloy/config.alloy),
# which makes it a transfer to a processor, and a full client IP is personal
# data. This repository already decided the same question for Sentry — no IP —
# and the log has no reason to be the exception, so the address is truncated at
# write time rather than scrubbed later: what is never written cannot leak.
#
# /16 for IPv4 and /32 for IPv6 keeps the one thing the log is actually used
# for after the fact — "is this burst one network or the whole internet" —
# while making the value useless for identifying a person. Per-address rate
# limiting is unaffected: it happens in the application (and at Cloudflare),
# not here.
#
# If a specific abuse investigation ever needs full addresses, change
# $client_net to $remote_addr below, for as long as it takes, and write down
# why. Do not make it the default.
map $remote_addr $client_net {
    ~^(?<ipv4_prefix>\d+\.\d+)\.\d+\.\d+$    "$ipv4_prefix.0.0";
    ~^(?<ipv6_prefix>[0-9a-fA-F]+:[0-9a-fA-F]+):  "$ipv6_prefix::";
    default                                        "unknown";
}

# The requested path, without the query string.
#
# $uri is the wrong variable here: try_files has already rewritten it, so every
# API call would be logged as "/index.php" and the log could not answer which
# endpoint is failing. $request_uri is the original, but carries the query
# string — which this application must never log (see below) — so the query is
# cut off here.
map $request_uri $request_path {
    ~^(?<path_only>[^?]*)  $path_only;
    default                "-";
}

# JSON so the fields survive log aggregation instead of being re-parsed out of
# a line with a regex. `request_id` is the value the RequestId middleware puts
# on the response, which is what ties an nginx line to its Laravel log lines
# and to the Sentry event.
log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"client_net":"$client_net",'
    '"method":"$request_method",'
    '"path":"$request_path",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"request_id":"$sent_http_x_request_id",'
    '"user_agent":"$http_user_agent"'
    '}';

server {
    listen 80;
    index index.php index.html;
    # To the container's streams rather than to files inside it, so
    # `docker logs` and the monitoring agent both see them. $query_string is
    # deliberately absent from json_combined above: this application carries
    # credentials in the URL (share tokens /i/:token and /q/:token, the
    # password-reset token, the OAuth code) and logging the query string would
    # hand them to log storage. Only $uri is recorded. $http_referer is left
    # out for the same reason — the SPA's own reset-password URL carries the
    # token, and it would arrive here as the referer.
    error_log  /dev/stderr warn;
    access_log /dev/stdout json_combined;
    root /var/www/public;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Telescope dashboard (only available in local/dev)
    location /telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Hide nginx version
    server_tokens off;

    # Max body size
    client_max_body_size 64M;
}
